<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wing Commander</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: 'Rajdhani', 'Eurostile', 'Bank Gothic', system-ui, sans-serif; }
      #viewport { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #000; color: #7fd4ff; letter-spacing: .35em; font-size: 13px;
        text-transform: uppercase; transition: opacity .6s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="ui-root"></div>
    <div id="boot">Initializing&nbsp;Flight&nbsp;Systems</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

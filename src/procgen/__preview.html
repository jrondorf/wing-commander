<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>procgen — hull texture preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0c0f; color: #b8c4d0;
    font: 12px/1.35 "Liberation Mono", monospace; overflow: hidden; }
  #wrap { display: grid; grid-template-columns: 1fr 480px; height: 100vh; }
  #view { position: relative; background: #05070a; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #side { overflow: auto; padding: 8px 10px; border-left: 1px solid #1d2530; }
  h2 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: #5ec8ff; margin: 10px 0 4px; font-weight: 400; }
  .maps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  #crops { grid-template-columns: repeat(2, 1fr); }
  .m { position: relative; }
  .m canvas { width: 100%; display: block; image-rendering: pixelated;
    border: 1px solid #1d2530; background: #000; }
  .m span { position: absolute; left: 3px; top: 2px; font-size: 9px;
    letter-spacing: .1em; color: #dfe8f0; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  #stats { white-space: pre; font-size: 10.5px; color: #8fa4b8; margin-top: 8px; }
  #hud { position: absolute; left: 10px; top: 8px; font-size: 11px;
    letter-spacing: .12em; color: #7fe4ff; text-shadow: 0 0 6px #003d55; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="view"><div id="hud"></div></div>
    <div id="side">
      <h2>maps</h2>
      <div class="maps" id="maps"></div>
      <h2>1:1 crops</h2>
      <div class="maps" id="crops"></div>
      <div id="stats"></div>
    </div>
  </div>
  <script type="module" src="./__preview.js"></script>
</body>
</html>
